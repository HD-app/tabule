<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ovládání - Kostky</title>
    <script type="text/javascript" src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --border: #334155;
            --active-border: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            padding: 15px; 
            max-width: 900px; 
            margin: 0 auto; 
            padding-bottom: 50px; 
        }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h2 { color: var(--accent); font-size: 1.5rem; }
        
        google-cast-launcher {
            --connected-color: var(--accent);
            --disconnected-color: #94a3b8;
            width: 38px; height: 38px; cursor: pointer;
        }

        /* Seznam hráčů nahoře */
        .players-list { 
            display: flex; 
            gap: 10px; 
            overflow-x: auto; 
            padding-bottom: 10px; 
            margin-bottom: 15px; 
            -webkit-overflow-scrolling: touch;
        }
        .player-chip {
            background: var(--card); border: 2px solid var(--border); border-radius: 12px;
            padding: 10px 15px; min-width: 130px; text-align: center; position: relative; flex-shrink: 0;
            transition: all 0.2s; cursor: pointer;
        }
        .player-chip.active {
            border-color: var(--active-border); background: #14532d;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.3);
        }
        .player-chip .name-input {
            background: transparent; border: none; border-bottom: 1px solid var(--accent);
            color: var(--text); font-weight: bold; width: 100%; text-align: center; font-size: 1rem;
        }
        .player-chip .score { font-size: 1.8rem; font-weight: 800; color: var(--accent); margin-top: 5px; }
        .turn-tag { font-size: 0.75rem; color: #4ade80; font-weight: bold; text-transform: uppercase; margin-top: 2px; }

        /* Panel aktuálního tahu */
        .turn-panel {
            background: var(--card); border: 2px solid var(--accent); border-radius: 16px;
            padding: 15px; margin-bottom: 20px; text-align: center;
        }
        .turn-title { font-size: 1rem; color: #94a3b8; font-weight: bold; }
        .turn-player-name { font-size: 1.8rem; font-weight: 900; color: var(--accent); }
        .turn-score-preview { font-size: 3.2rem; font-weight: 900; color: #4ade80; margin: 5px 0; }
        
        .action-row { display: flex; gap: 10px; margin-top: 10px; }
        .btn-confirm { 
            flex: 2; background: #22c55e; color: #000; font-weight: 900; font-size: 1.1rem; 
            padding: 14px 8px; border: none; border-radius: 10px; cursor: pointer; 
            transition: opacity 0.1s;
        }
        .btn-zero { 
            flex: 1; background: #ef4444; color: #fff; font-weight: bold; font-size: 1rem; 
            padding: 14px 8px; border: none; border-radius: 10px; cursor: pointer; 
            transition: opacity 0.1s;
        }
        .btn-confirm:active, .btn-zero:active { opacity: 0.8; }
        .btn-reset-turn { 
            background: #334155; color: #fff; padding: 10px 15px; border: none; 
            border-radius: 8px; margin-top: 12px; font-size: 0.85rem; cursor: pointer; 
            width: 100%; max-width: 300px;
        }

        /* Responzivní mřížka pro tlačítka kombinací */
        .combo-section-title { 
            font-size: 1rem; color: var(--accent); margin: 20px 0 8px 0; 
            text-transform: uppercase; letter-spacing: 1px; font-weight: bold; 
        }
        
        .combo-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); /* 2 sloupce na mobilu */
            gap: 8px; 
        }

        @media (min-width: 600px) {
            .combo-grid {
                grid-template-columns: repeat(4, 1fr); /* 4 sloupce na PC a tabletech */
            }
        }

        .btn-combo {
            background: #1e293b; border: 1px solid var(--border); color: var(--text);
            padding: 12px 6px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: background 0.1s, transform 0.05s; min-height: 60px;
        }
        .btn-combo:active { background: var(--accent); color: #000; transform: scale(0.98); }
        .btn-combo:active .pts { color: #000; }
        .btn-combo .pts { color: #38bdf8; font-weight: 800; font-size: 0.95rem; margin-top: 2px; }

        .controls { display: flex; gap: 10px; margin-top: 25px; }
        .btn-sec { flex: 1; background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-danger { color: #f87171; border-color: #7f1d1d; }
        .status { text-align: center; font-size: 0.85rem; color: var(--accent); margin-top: 15px; }

        @media (max-width: 400px) {
            .action-row { flex-direction: column; }
            .btn-confirm, .btn-zero { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>🎮 Ovládání</h2>
        <google-cast-launcher id="castbutton"></google-cast-launcher>
    </div>

    <!-- Seznam hráčů nahoře -->
    <div class="players-list" id="playersList"></div>

    <!-- Panel pro zadávání bodů v tahu -->
    <div class="turn-panel">
        <div class="turn-title">NA ŘADĚ JE</div>
        <div class="turn-player-name" id="activePlayerName">Hráč 1</div>
        <div class="turn-score-preview" id="turnScore">0 b.</div>
        
        <div class="action-row">
            <button class="btn-zero" onclick="addZero()">NULA (0 b.)</button>
            <button class="btn-confirm" onclick="confirmTurn()">POTVRDIT & DALŠÍ ➔</button>
        </div>
        <button class="btn-reset-turn" onclick="resetCurrentTurn()">Smazat právě naklikávané body</button>
    </div>

    <!-- Tlačítka podle tabulky kostek -->
    <div class="combo-section-title">🎲 Jednotlivé kostky</div>
    <div class="combo-grid">
        <button class="btn-combo" onclick="addCombo(100)">Samostatná 1<span class="pts">+100 b.</span></button>
        <button class="btn-combo" onclick="addCombo(50)">Samostatná 5<span class="pts">+50 b.</span></button>
    </div>

    <div class="combo-section-title">🎲 Postupky a Párů</div>
    <div class="combo-grid">
        <button class="btn-combo" onclick="addCombo(500)">Malá postupka<span class="pts">+500 b.</span></button>
        <button class="btn-combo" onclick="addCombo(750)">Velká postupka<span class="pts">+750 b.</span></button>
        <button class="btn-combo" onclick="addCombo(1500)">Kompletní postupka<span class="pts">+1500 b.</span></button>
        <button class="btn-combo" onclick="addCombo(750)">Tři páry<span class="pts">+750 b.</span></button>
    </div>

    <div class="combo-section-title">🎲 Počet stejných čísel</div>
    <div class="combo-grid">
        <button class="btn-combo" onclick="addCombo(1000)">3x Jednička<span class="pts">+1000 b.</span></button>
        <button class="btn-combo" onclick="addCombo(2000)">4x Jednička<span class="pts">+2000 b.</span></button>
        <button class="btn-combo" onclick="addCombo(4000)">5x Jednička<span class="pts">+4000 b.</span></button>
        <button class="btn-combo" onclick="addCombo(8000)">6x Jednička<span class="pts">+8000 b.</span></button>

        <button class="btn-combo" onclick="addCombo(200)">3x Dvojka<span class="pts">+200 b.</span></button>
        <button class="btn-combo" onclick="addCombo(400)">4x Dvojka<span class="pts">+400 b.</span></button>
        <button class="btn-combo" onclick="addCombo(800)">5x Dvojka<span class="pts">+800 b.</span></button>
        <button class="btn-combo" onclick="addCombo(1600)">6x Dvojka<span class="pts">+1600 b.</span></button>

        <button class="btn-combo" onclick="addCombo(300)">3x Trojka<span class="pts">+300 b.</span></button>
        <button class="btn-combo" onclick="addCombo(600)">4x Trojka<span class="pts">+600 b.</span></button>
        <button class="btn-combo" onclick="addCombo(1200)">5x Trojka<span class="pts">+1200 b.</span></button>
        <button class="btn-combo" onclick="addCombo(2400)">6x Trojka<span class="pts">+2400 b.</span></button>

        <button class="btn-combo" onclick="addCombo(400)">3x Čtyřka<span class="pts">+400 b.</span></button>
        <button class="btn-combo" onclick="addCombo(800)">4x Čtyřka<span class="pts">+800 b.</span></button>
        <button class="btn-combo" onclick="addCombo(1600)">5x Čtyřka<span class="pts">+1600 b.</span></button>
        <button class="btn-combo" onclick="addCombo(3200)">6x Čtyřka<span class="pts">+3200 b.</span></button>

        <button class="btn-combo" onclick="addCombo(500)">3x Pětka<span class="pts">+500 b.</span></button>
        <button class="btn-combo" onclick="addCombo(1000)">4x Pětka<span class="pts">+1000 b.</span></button>
        <button class="btn-combo" onclick="addCombo(2000)">5x Pětka<span class="pts">+2000 b.</span></button>
        <button class="btn-combo" onclick="addCombo(4000)">6x Pětka<span class="pts">+4000 b.</span></button>

        <button class="btn-combo" onclick="addCombo(600)">3x Šestka<span class="pts">+600 b.</span></button>
        <button class="btn-combo" onclick="addCombo(1200)">4x Šestka<span class="pts">+1200 b.</span></button>
        <button class="btn-combo" onclick="addCombo(2400)">5x Šestka<span class="pts">+2400 b.</span></button>
        <button class="btn-combo" onclick="addCombo(4800)">6x Šestka<span class="pts">+4800 b.</span></button>
    </div>

    <div class="controls">
        <button class="btn-sec" onclick="addPlayer()">+ Přidat hráče</button>
        <button class="btn-sec btn-danger" onclick="resetScores()">Vynulovat hru</button>
    </div>
    <div class="status" id="status">Připojování...</div>

    <script>
        const FIREBASE_URL = 'https://klubac-laser-game-default-rtdb.europe-west1.firebasedatabase.app/hra.json';

        let players = [
            { id: 1, name: "Hráč 1", score: 0, history: [] },
            { id: 2, name: "Hráč 2", score: 0, history: [] }
        ];
        
        let activePlayerIndex = 0;
        let currentTurnPoints = 0;

        async function loadInitial() {
            try {
                const res = await fetch(FIREBASE_URL);
                if (res.ok) {
                    const data = await res.json();
                    if (data && Array.isArray(data)) {
                        players = data.map(p => ({ ...p, history: p.history || [] }));
                    }
                }
            } catch (e) {
                console.error("Chyba při načítání", e);
            }
            render();
            document.getElementById('status').innerText = 'Připojeno 🔥';
        }

        async function sync() {
            render();
            document.getElementById('status').innerText = 'Ukládám do cloudu...';
            try {
                await fetch(FIREBASE_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(players)
                });
                document.getElementById('status').innerText = 'Uloženo ✅';
            } catch (e) {
                document.getElementById('status').innerText = 'Chyba ukládání ❌';
            }
        }

        function render() {
            if (activePlayerIndex >= players.length) activePlayerIndex = 0;
            const activePlayer = players[activePlayerIndex];

            document.getElementById('playersList').innerHTML = players.map((p, idx) => `
                <div class="player-chip ${idx === activePlayerIndex ? 'active' : ''}" onclick="selectPlayer(${idx})">
                    <input type="text" class="name-input" value="${p.name}" onchange="updateName(${p.id}, this.value)" onclick="event.stopPropagation()">
                    <div class="score">${p.score}</div>
                    ${idx === activePlayerIndex ? '<div class="turn-tag">NA ŘADĚ</div>' : ''}
                </div>
            `).join('');

            document.getElementById('activePlayerName').innerText = activePlayer ? activePlayer.name : '';
            document.getElementById('turnScore').innerText = `${currentTurnPoints} b.`;
        }

        function addCombo(pts) {
            currentTurnPoints += pts;
            render();
        }

        function resetCurrentTurn() {
            currentTurnPoints = 0;
            render();
        }

        function addZero() {
            const player = players[activePlayerIndex];
            if (player) {
                if (!player.history) player.history = [];
                player.history.push(0);
                currentTurnPoints = 0;
                nextTurn();
                sync();
            }
        }

        function confirmTurn() {
            const player = players[activePlayerIndex];
            if (player) {
                if (!player.history) player.history = [];
                player.history.push(currentTurnPoints);
                player.score += currentTurnPoints;
                currentTurnPoints = 0;
                nextTurn();
                sync();
            }
        }

        function nextTurn() {
            activePlayerIndex = (activePlayerIndex + 1) % players.length;
        }

        function selectPlayer(idx) {
            activePlayerIndex = idx;
            currentTurnPoints = 0;
            render();
        }

        function updateName(id, val) {
            const p = players.find(p => p.id === id);
            if (p) p.name = val || `Hráč ${id}`;
            sync();
        }

        function addPlayer() {
            players.push({ id: Date.now(), name: `Hráč ${players.length + 1}`, score: 0, history: [] });
            sync();
        }

        function resetScores() {
            if (confirm("Opravdu vynulovat celou hru všem?")) {
                players.forEach(p => {
                    p.score = 0;
                    p.history = [];
                });
                activePlayerIndex = 0;
                currentTurnPoints = 0;
                sync();
            }
        }

        loadInitial();
    </script>
</body>
</html>
